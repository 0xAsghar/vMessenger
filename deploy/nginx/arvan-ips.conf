# Restores the real client IP when the node is fronted by Arvan CDN.
# Copied to /etc/nginx/snippets/vmessenger-realip.conf by
# `scripts/setup-node.sh --behind-cdn arvan`. Without the set_real_ip_from
# entries nginx (and the node's per-IP limits) see the CDN edge address, so
# the rate limits stay deliberately generous.
#
# Fill the list from the Arvan panel / published origin-pull ranges, e.g.
#   set_real_ip_from 185.143.232.0/22;
# One line per CIDR. Keep this file free of secrets — it is public.

real_ip_header X-Forwarded-For;
real_ip_recursive on;
