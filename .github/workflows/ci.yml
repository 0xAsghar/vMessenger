name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google removed the obsolete `tools` package from the SDK repository, and this action
          # still asks for it by default, so sdkmanager exits 1 on "Failed to find package
          # 'tools'" before a single Gradle task runs. platform-tools is the part the build
          # actually uses; the Android Gradle plugin fetches the platform and build-tools itself.
          packages: platform-tools

      - name: Configure local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Detekt
        run: ./gradlew detekt

      - name: Assemble debug app and node distribution
        run: ./gradlew assembleDebug :node:installDist

      # `unitTests` aggregates Android `testDebugUnitTest` and the JVM modules'
      # `test` (core:common, domain, node), which plain testDebugUnitTest skips.
      - name: Unit tests
        run: ./gradlew unitTests
